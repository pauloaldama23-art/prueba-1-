<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIDA360 — Organización Estudiantil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090f;
      --bg-elevated: #0d111c;
      --bg-card: #121826;
      --bg-card-hover: #171e2e;
      --border: rgba(255,255,255,0.06);
      --border-strong: rgba(255,255,255,0.1);
      --text: #f0f2f5;
      --text-secondary: #8b93a7;
      --text-muted: #5c657a;
      --accent: #7c5cfc;
      --accent-soft: rgba(124, 92, 252, 0.15);
      --accent-hover: #6a4df0;
      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.12);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.12);
      --orange: #f59e0b;
      --orange-soft: rgba(245, 158, 11, 0.12);
      --blue: #3b82f6;
      --radius: 14px;
      --radius-sm: 10px;
      --radius-xs: 8px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --sidebar-w: 250px;
      --transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }

    /* ========== LAYOUT ========== */
    .app { display: flex; min-height: 100vh; }

    /* ========== SIDEBAR ========== */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg-elevated);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 100;
      transition: transform 0.25s ease;
    }

    .sidebar-header {
      padding: 22px 20px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, #7c5cfc 0%, #a78bfa 100%);
      border-radius: 10px;
      display: grid; place-items: center;
      font-weight: 700; font-size: 13px; color: #fff;
      box-shadow: 0 4px 12px rgba(124, 92, 252, 0.35);
    }

    .logo-text {
      font-size: 17px; font-weight: 700; letter-spacing: -0.4px;
    }
    .logo-text span { color: var(--accent); }

    .nav { flex: 1; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }

    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 11px 13px;
      border-radius: var(--radius-xs);
      color: var(--text-secondary);
      font-size: 13.5px; font-weight: 500;
      cursor: pointer; border: none; background: none;
      width: 100%; text-align: left;
      transition: all var(--transition);
    }
    .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .nav-item.active {
      background: var(--accent-soft);
      color: #c4b5fd;
    }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.85; }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    /* ========== MAIN ========== */
    .main {
      flex: 1;
      margin-left: var(--sidebar-w);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(13, 17, 28, 0.85);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }

    .topbar-left { display: flex; align-items: center; gap: 14px; }
    .menu-toggle { display: none; background: none; border: none; color: var(--text); cursor: pointer; padding: 6px; }
    .page-title { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }

    .user-badge {
      display: flex; align-items: center; gap: 9px;
      padding: 5px 12px 5px 5px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .user-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, #7c5cfc, #22c55e);
      display: grid; place-items: center;
      font-size: 11px; font-weight: 600;
    }
    .user-badge span { font-size: 12.5px; font-weight: 500; color: var(--text-secondary); }

    .content { padding: 28px; flex: 1; }

    .view { display: none; animation: fadeUp 0.22s ease; }
    .view.active { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========== CARDS ========== */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: border-color var(--transition);
    }
    .card:hover { border-color: var(--border-strong); }

    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 13px; font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* ========== BUTTONS ========== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 9px 15px;
      border-radius: var(--radius-xs);
      font-size: 13px; font-weight: 500;
      cursor: pointer; border: none;
      transition: all var(--transition);
      font-family: inherit;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 10px rgba(124, 92, 252, 0.3);
    }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-secondary {
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.07); }
    .btn-ghost { background: transparent; color: var(--text-secondary); }
    .btn-ghost:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .btn-sm { padding: 6px 11px; font-size: 12px; }
    .btn-icon { width: 34px; height: 34px; padding: 0; border-radius: var(--radius-xs); }

    /* ========== FORMS ========== */
    .form-group { margin-bottom: 15px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 500;
      color: var(--text-secondary); margin-bottom: 6px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 13px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      color: var(--text);
      font-size: 13.5px;
      font-family: inherit;
      transition: border-color var(--transition);
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-error { color: var(--red); font-size: 11.5px; margin-top: 4px; display: none; }
    .form-input.error { border-color: var(--red); }

    /* ========== DASHBOARD ========== */
    .dashboard-header { margin-bottom: 26px; }
    .greeting {
      font-size: 26px; font-weight: 700;
      letter-spacing: -0.6px; margin-bottom: 3px;
    }
    .greeting span { color: #c4b5fd; }
    .current-date { color: var(--text-secondary); font-size: 14px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      position: relative;
      overflow: hidden;
    }
    .stat-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
    }
    .stat-card.purple::after { background: var(--accent); }
    .stat-card.green::after { background: var(--green); }
    .stat-card.blue::after { background: var(--blue); }
    .stat-card.orange::after { background: var(--orange); }

    .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 7px; }
    .stat-value { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .stat-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 16px;
    }

    .task-list { display: flex; flex-direction: column; gap: 8px; }

    .task-item {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: all var(--transition);
      cursor: pointer;
    }
    .task-item:hover { border-color: rgba(124,92,252,0.3); background: var(--bg-card-hover); }
    .task-item.completed { opacity: 0.5; }
    .task-item.completed .task-title { text-decoration: line-through; color: var(--text-muted); }

    .task-check {
      width: 19px; height: 19px;
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      display: grid; place-items: center;
      flex-shrink: 0;
      transition: all var(--transition);
      cursor: pointer;
    }
    .task-check.checked { background: var(--green); border-color: var(--green); }
    .task-check.checked svg { display: block; }
    .task-check svg { display: none; width: 11px; height: 11px; color: #fff; }

    .task-info { flex: 1; min-width: 0; }
    .task-title {
      font-size: 13.5px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .task-meta {
      display: flex; align-items: center; gap: 8px;
      margin-top: 3px; font-size: 11.5px; color: var(--text-muted);
    }

    .priority-badge {
      padding: 2px 7px; border-radius: 999px;
      font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    }
    .priority-high { background: var(--red-soft); color: #f87171; }
    .priority-medium { background: var(--orange-soft); color: #fbbf24; }
    .priority-low { background: var(--green-soft); color: #4ade80; }

    .subject-tag {
      background: var(--accent-soft);
      color: #c4b5fd;
      padding: 2px 7px; border-radius: 999px;
      font-size: 10.5px; font-weight: 500;
    }

    .progress-ring { width: 110px; height: 110px; margin: 0 auto 14px; }
    .progress-ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
    .progress-ring .bg { stroke: rgba(255,255,255,0.06); }
    .progress-ring .progress {
      stroke: var(--green);
      stroke-dasharray: 283;
      stroke-dashoffset: 283;
      transition: stroke-dashoffset 0.6s ease;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
    .progress-text { text-align: center; }
    .progress-percent { font-size: 28px; font-weight: 700; }
    .progress-label { font-size: 12px; color: var(--text-secondary); }

    .next-deadline {
      margin-top: 18px; padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .next-deadline-title { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    .next-deadline-content { font-size: 14px; font-weight: 500; }
    .next-deadline-date { font-size: 12px; color: #c4b5fd; margin-top: 3px; }

    /* ========== TASKS ========== */
    .view-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
    }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; }

    .filter-btn {
      padding: 6px 13px; border-radius: 999px;
      font-size: 12.5px; font-weight: 500;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      cursor: pointer; transition: all var(--transition);
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent-soft);
      border
